<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tạo Icon">
  <meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Tạo icon phím tắt và webclip cho iOS">
  <title>Tạo Icon</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-home-screen.png" sizes="180x180">
  <link rel="apple-touch-icon" href="icon-home-screen.png" sizes="1024x1024">
  <link rel="icon" type="image/png" href="icon-home-screen.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Tạo Icon</h1>
      <p>Phím tắt &amp; webclip iOS</p>
    </div>
    <div class="tools">
      <button type="button" id="undo" title="Hoàn tác">↩</button>
      <button type="button" id="redo" title="Làm lại">↪</button>
      <button type="button" id="reset" title="Đặt lại">↺</button>
    </div>
  </header>

  <div class="workspace">
  <section class="stage" id="stage">
    <div class="mock" id="mock">
      <div class="stage-frame" id="frame">
        <canvas id="c" width="1024" height="1024"></canvas>
        <div class="safe" id="safe" hidden></div>
      </div>
      <div class="mock-name" id="mockName">Icon</div>
    </div>
    <p class="warn" id="warn" hidden></p>
  </section>

  <nav class="rail" id="rail" aria-label="Công cụ">
    <button type="button" data-panel="bg">Nền</button>
    <button type="button" data-panel="radius">Bo góc</button>
    <button type="button" data-panel="glass">Kính</button>
    <button type="button" data-panel="shadow">Bóng</button>
    <button type="button" data-panel="mark">Chữ</button>
    <button type="button" data-panel="media">Ảnh</button>
    <button type="button" data-panel="home">MH</button>
    <button type="button" data-panel="export">Xuất</button>
  </nav>
  </div>

  <aside class="sheet" id="sheet" hidden>
    <div class="sheet-head">
      <strong id="sheetTitle">Nền</strong>
      <button type="button" id="sheetClose">Đóng</button>
    </div>
    <div class="sheet-body">

      <div class="pane" data-pane="bg">
        <label class="field"><span>Kiểu nền</span>
          <select id="bg">
            <option value="grad2">Gradient 2 màu</option>
            <option value="grad3">Gradient 3 màu</option>
            <option value="solid">Màu đơn</option>
            <option value="clear">Trong suốt</option>
          </select>
        </label>
        <div class="swatches">
          <label class="swatch"><input id="c1" type="color" value="#1c8f86"><span>Màu 1</span></label>
          <label class="swatch"><input id="c2" type="color" value="#3dcc6e"><span>Màu 2</span></label>
          <label class="swatch"><input id="c3" type="color" value="#e8fff4"><span>Màu 3</span></label>
        </div>
        <label class="slide"><span>Góc gradient <em id="angVal">45</em>°</span>
          <input id="ang" type="range" min="0" max="360" value="45">
        </label>
        <label class="slide"><span>Noise <em id="noiseVal">6</em></span>
          <input id="noise" type="range" min="0" max="40" value="6">
        </label>
        <div class="row">
          <button class="file grow" id="pickDrop" type="button">Lấy màu</button>
          <label class="field grow"><span>Gắn vào</span>
            <select id="dropTo">
              <option value="c1">Nền 1</option>
              <option value="c2">Nền 2</option>
              <option value="ink">Chữ A</option>
              <option value="ink2">Chữ B</option>
            </select>
          </label>
        </div>
      </div>

      <div class="pane" data-pane="radius">
        <label class="slide"><span>Bo góc <em id="radiusVal">0</em></span>
          <input id="radius" type="range" min="0" max="512" value="0">
        </label>
        <label class="check"><input id="squircle" type="checkbox"><span>Squircle iOS</span></label>
        <label class="check"><input id="safeOn" type="checkbox"><span>Safe zone</span></label>
      </div>

      <div class="pane" data-pane="glass">
        <label class="slide"><span>Kính trong <em id="glassVal">0</em></span>
          <input id="glass" type="range" min="0" max="80" value="0">
        </label>
        <label class="slide"><span>Viền sáng <em id="strokeVal">0</em></span>
          <input id="stroke" type="range" min="0" max="32" value="0">
        </label>
        <label class="slide"><span>Lề nội dung <em id="padVal">48</em></span>
          <input id="pad" type="range" min="0" max="280" value="48">
        </label>
      </div>

      <div class="pane" data-pane="shadow">
        <div class="chips" id="styles">
          <button type="button" data-style="flat">Phẳng</button>
          <button type="button" data-style="glass">Kính</button>
          <button type="button" data-style="neu">Neu</button>
          <button type="button" data-style="glow">Glow</button>
          <button type="button" data-style="clay">Sét</button>
          <button type="button" data-style="soft">Mềm</button>
        </div>
        <label class="field"><span>Thêm lớp</span>
          <select id="addLayer">
            <option value="">+ Thêm lớp…</option>
            <option value="outer">Bóng Ngoài</option>
            <option value="inset">Bóng Chìm</option>
            <option value="soft">Mờ Diện Rộng</option>
            <option value="hard">Nổi Khối 3D</option>
            <option value="glow">Phát Sáng</option>
            <option value="bottom">Bóng Dưới (Apple)</option>
            <option value="floating">Nổi Bay</option>
            <option value="pressed">Ấn Xuống</option>
            <option value="pop">Pop Bubble</option>
            <option value="double">Viền Kép</option>
            <option value="neu">Neumorphism Nổi</option>
            <option value="neuIn">Neumorphism Chìm</option>
            <option value="neon">Neon</option>
            <option value="long">Bóng Dài Retro</option>
            <option value="crisp">Sắc Nét Nhẹ</option>
            <option value="clay">Đất Sét 3D</option>
          </select>
        </label>
        <div class="layers" id="layerList"></div>
        <label class="field"><span>Lớp này áp lên</span>
          <select id="layerTarget">
            <option value="frame">Khung icon</option>
            <option value="content">Ảnh / SVG / chữ</option>
          </select>
        </label>
        <label class="slide"><span>X <em id="sxVal">0</em></span><input id="sx" type="range" min="-60" max="60" value="0"></label>
        <label class="slide"><span>Y <em id="syVal">18</em></span><input id="sy" type="range" min="-60" max="60" value="18"></label>
        <label class="slide"><span>Làm mờ <em id="sblurVal">24</em></span><input id="sblur" type="range" min="0" max="80" value="24"></label>
        <label class="slide"><span>Độ đậm <em id="salphaVal">40</em></span><input id="salpha" type="range" min="0" max="90" value="40"></label>
        <label class="swatch lone"><input id="scolor" type="color" value="#000000"><span>Màu bóng</span></label>
        <label class="check"><input id="bakeShadow" type="checkbox"><span>Thu nhỏ icon để chừa bóng khi xuất</span></label>
      </div>

      <div class="pane" data-pane="mark">
        <label class="field"><span>Tìm symbol</span>
          <input id="symQ" type="search" placeholder="wifi, pin, tim…" autocomplete="off">
        </label>
        <div class="symgrid" id="symGrid"></div>
        <label class="field"><span>Chữ</span>
          <input id="letters" maxlength="24" placeholder="Tên icon" value="S" autocomplete="off">
        </label>
        <label class="field"><span>Font</span>
          <select id="font">
            <option value="system-ui, -apple-system, sans-serif">SF / System</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="'Courier New', monospace">Courier New</option>
            <option value="'Arial Black', sans-serif">Arial Black</option>
          </select>
        </label>
        <label class="field"><span>Màu chữ / SVG</span>
          <select id="inkMode">
            <option value="solid">Một màu</option>
            <option value="grad">Gradient</option>
          </select>
        </label>
        <div class="swatches">
          <label class="swatch"><input id="ink" type="color" value="#5ac8fa"><span>Màu A</span></label>
          <label class="swatch"><input id="ink2" type="color" value="#007aff"><span>Màu B</span></label>
        </div>
        <label class="slide"><span>Góc màu <em id="inkAngVal">90</em>°</span>
          <input id="inkAng" type="range" min="0" max="360" value="90">
        </label>
        <label class="slide"><span>Cỡ <em id="sizeVal">220</em></span>
          <input id="size" type="range" min="12" max="900" value="220">
        </label>
        <label class="slide"><span>Mờ <em id="alphaVal">100</em>%</span>
          <input id="alpha" type="range" min="10" max="100" value="100">
        </label>
        <label class="field"><span>Dòng 2</span>
          <input id="letters2" maxlength="24" placeholder="Phụ đề" value="" autocomplete="off">
        </label>
        <label class="slide"><span>Cỡ dòng 2 <em id="size2Val">96</em></span>
          <input id="size2" type="range" min="0" max="400" value="96">
        </label>
        <label class="slide"><span>Giãn dòng <em id="gap2Val">8</em></span>
          <input id="gap2" type="range" min="-40" max="80" value="8">
        </label>
        <label class="check"><input id="snap" type="checkbox" checked><span>Snap tâm khi kéo</span></label>
        <button class="file" id="autoInk" type="button">Màu theo nền</button>
        <select id="mark" hidden>
          <option value="none">Không</option>
          <option value="text" selected>Chữ</option>
          <option value="sun">sun</option>
          <option value="plus">plus</option>
          <option value="gear">gear</option>
          <option value="mail">mail</option>
          <option value="phone">phone</option>
          <option value="star">star</option>
          <option value="heart">heart</option>
          <option value="svg">svg</option>
          <option value="photo">photo</option>
        </select>
      </div>

      <div class="pane" data-pane="media">
        <button class="file" id="pick" type="button">Chọn ảnh / SVG</button>
        <button class="file" id="cam" type="button">Chụp ảnh</button>
        <label class="slide"><span>Phóng <em id="zoomVal">100</em>%</span>
          <input id="zoom" type="range" min="20" max="400" value="100">
        </label>
        <label class="slide"><span>Ngang <em id="pxVal">50</em></span>
          <input id="px" type="range" min="-20" max="120" value="50">
        </label>
        <label class="slide"><span>Dọc <em id="pyVal">50</em></span>
          <input id="py" type="range" min="-20" max="120" value="50">
        </label>
        <label class="slide"><span>Xoay <em id="rotVal">0</em>°</span>
          <input id="rot" type="range" min="-180" max="180" value="0">
        </label>
        <div class="row">
          <label class="check"><input id="flipH" type="checkbox"><span>Lật ngang</span></label>
          <label class="check"><input id="flipV" type="checkbox"><span>Lật dọc</span></label>
        </div>
        <button class="file" id="center" type="button">Căn giữa</button>
        <label class="check"><input id="keepSvg" type="checkbox"><span>Giữ màu gốc SVG</span></label>
      </div>

      <div class="pane" data-pane="home">
        <div class="dock" id="dock">
          <i></i><i></i>
          <canvas id="mini" width="180" height="180"></canvas>
          <i></i>
        </div>
        <label class="check"><input id="mockOn" type="checkbox" checked><span>Khung xem trước</span></label>
        <label class="field"><span>Tên</span>
          <input id="label" maxlength="14" value="Icon" autocomplete="off">
        </label>
        <label class="field"><span>Nền khung</span>
          <select id="wall">
            <option value="system" selected>Hệ thống</option>
            <option value="ios">Wallpaper iOS</option>
            <option value="dark">Tối</option>
            <option value="light">Sáng</option>
            <option value="sunset">Hoàng hôn</option>
          </select>
        </label>
        <div class="row">
          <button class="file grow" id="saveLib" type="button">Lưu vào kho</button>
          <button class="file grow" id="saveStyle" type="button">Lưu style</button>
        </div>
        <button class="file" id="applyStyle" type="button">Áp style đã lưu</button>
        <div class="lib" id="lib"></div>
      </div>

      <div class="pane" data-pane="export">
        <label class="field"><span>Tên file</span>
          <input id="fileBase" maxlength="32" value="icon-home-screen" autocomplete="off">
        </label>
        <label class="check"><input id="opaque" type="checkbox" checked><span>PNG nền đặc</span></label>
        <button class="go" id="share1024" type="button">Chia sẻ PNG 1024</button>
        <button class="go alt" id="share180" type="button">Chia sẻ PNG 180</button>
        <button class="go alt" id="shareZip" type="button">Gói webclip ZIP</button>
        <button class="go alt" id="shareSvg" type="button">Chia sẻ SVG</button>
        <button class="go ghost" id="dl1024" type="button">Tải PNG 1024</button>
      </div>

    </div>
  </aside>

  <input id="file" type="file" accept="image/*,.svg,image/svg+xml" hidden>
  <input id="fileCam" type="file" accept="image/*" capture="environment" hidden>

  <script src="js/app.js" defer></script>
</body>
</html>
