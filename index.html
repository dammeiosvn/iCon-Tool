<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tạo Icon">
  <meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Tạo icon phím tắt và webclip cho iOS">
  <title>Tạo Icon</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-home-screen.png">
  <link rel="icon" type="image/png" href="icon-home-screen.png">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <main>
    <header class="top">
      <h1>Tạo Icon</h1>
      <p>Phím tắt &amp; webclip iOS</p>
    </header>

    <section class="stage" aria-label="Xem trước icon">
      <div class="stage-frame" id="frame">
        <canvas id="c" width="1024" height="1024" aria-label="Canvas icon"></canvas>
      </div>
      <p class="hint">Kéo ảnh trong khung để chỉnh vị trí. Chụm để phóng.</p>
    </section>

    <section class="panels" id="panels">

      <details class="panel" open>
        <summary>Nền</summary>
        <div class="drawer">
          <label class="field">
            <span>Kiểu nền</span>
            <select id="bg">
              <option value="grad2">Gradient 2 màu</option>
              <option value="grad3">Gradient 3 màu</option>
              <option value="solid">Màu đơn</option>
              <option value="clear">Trong suốt</option>
            </select>
          </label>
          <div class="swatches">
            <label class="swatch"><input id="c1" type="color" value="#1c8f86"><span>Màu 1</span></label>
            <label class="swatch"><input id="c2" type="color" value="#3dcc6e"><span>Màu 2</span></label>
            <label class="swatch"><input id="c3" type="color" value="#e8fff4"><span>Màu 3</span></label>
          </div>
          <label class="slide">
            <span>Noise <em id="noiseVal">6</em></span>
            <input id="noise" type="range" min="0" max="40" value="6">
          </label>
        </div>
      </details>

      <details class="panel">
        <summary>Bo góc</summary>
        <div class="drawer">
          <label class="slide">
            <span>Bo góc <em id="radiusVal">0</em></span>
            <input id="radius" type="range" min="0" max="512" value="0">
          </label>
          <p class="note">0 = iOS tự cắt squircle. 512 = hình tròn.</p>
        </div>
      </details>

      <details class="panel">
        <summary>Kính &amp; viền</summary>
        <div class="drawer">
          <label class="slide">
            <span>Kính trong <em id="glassVal">0</em></span>
            <input id="glass" type="range" min="0" max="80" value="0">
          </label>
          <label class="slide">
            <span>Viền sáng <em id="strokeVal">0</em></span>
            <input id="stroke" type="range" min="0" max="32" value="0">
          </label>
          <label class="slide">
            <span>Lề nội dung <em id="padVal">12</em></span>
            <input id="pad" type="range" min="0" max="280" value="12">
          </label>
        </div>
      </details>

      <details class="panel">
        <summary>Đổ bóng</summary>
        <div class="drawer">
          <label class="field">
            <span>Kiểu bóng</span>
            <select id="shadowPreset">
              <option value="none">Không</option>
              <option value="outer">Bóng Ngoài</option>
              <option value="inset">Bóng Chìm</option>
              <option value="soft">Mờ Diện Rộng</option>
              <option value="hard">Nổi Khối 3D</option>
              <option value="glow">Phát Sáng</option>
              <option value="bottom">Bóng Dưới (Apple)</option>
              <option value="floating">Nổi Bay</option>
              <option value="pressed">Ấn Xuống</option>
              <option value="pop">Pop Bubble</option>
              <option value="double">Viền Kép</option>
              <option value="neu">Neumorphism Nổi</option>
              <option value="neuIn">Neumorphism Chìm</option>
              <option value="neon">Neon</option>
              <option value="long">Bóng Dài Retro</option>
              <option value="crisp">Sắc Nét Nhẹ</option>
              <option value="clay">Đất Sét 3D</option>
            </select>
          </label>
          <label class="slide">
            <span>X <em id="sxVal">0</em></span>
            <input id="sx" type="range" min="-60" max="60" value="0">
          </label>
          <label class="slide">
            <span>Y <em id="syVal">18</em></span>
            <input id="sy" type="range" min="-60" max="60" value="18">
          </label>
          <label class="slide">
            <span>Làm mờ <em id="sblurVal">24</em></span>
            <input id="sblur" type="range" min="0" max="80" value="24">
          </label>
          <label class="slide">
            <span>Độ đậm <em id="salphaVal">40</em></span>
            <input id="salpha" type="range" min="0" max="90" value="40">
          </label>
          <label class="swatch lone">
            <input id="scolor" type="color" value="#000000">
            <span>Màu bóng</span>
          </label>
          <label class="check">
            <input id="shadowFrame" type="checkbox" checked>
            <span>Bóng khung icon</span>
          </label>
          <label class="check">
            <input id="shadowContent" type="checkbox" checked>
            <span>Bóng ảnh / SVG / chữ / ký hiệu</span>
          </label>
          <label class="check">
            <input id="bakeShadow" type="checkbox">
            <span>Thu nhỏ icon để chừa bóng khi xuất</span>
          </label>
        </div>
      </details>

      <details class="panel">
        <summary>Ký hiệu &amp; chữ</summary>
        <div class="drawer">
          <label class="field">
            <span>Ký hiệu</span>
            <select id="mark">
              <option value="none">Không</option>
              <option value="text" selected>Chữ 1–2 ký tự</option>
              <option value="sun">Mặt trời</option>
              <option value="plus">Dấu cộng</option>
              <option value="gear">Bánh răng</option>
              <option value="mail">Thư</option>
              <option value="phone">Điện thoại</option>
              <option value="star">Sao</option>
              <option value="heart">Trái tim</option>
              <option value="svg">SVG của bạn</option>
              <option value="photo">Ảnh trong khung</option>
            </select>
          </label>
          <label class="field">
            <span>Chữ</span>
            <input id="letters" maxlength="2" placeholder="1–2 ký tự" value="S" autocomplete="off">
          </label>
          <div class="row">
            <label class="field grow">
              <span>Font</span>
              <select id="font">
                <option value="system-ui, -apple-system, sans-serif">SF / System</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="'Courier New', monospace">Courier New</option>
                <option value="'Arial Black', sans-serif">Arial Black</option>
              </select>
            </label>
            <label class="swatch">
              <input id="ink" type="color" value="#ffffff">
              <span>Màu chữ/SVG</span>
            </label>
          </div>
          <label class="slide">
            <span>Cỡ chữ / icon <em id="sizeVal">220</em></span>
            <input id="size" type="range" min="40" max="520" value="220">
          </label>
        </div>
      </details>

      <details class="panel">
        <summary>Ảnh &amp; SVG</summary>
        <div class="drawer">
          <button class="file" id="pick" type="button">Chọn ảnh hoặc SVG</button>
          <label class="slide">
            <span>Phóng ảnh <em id="zoomVal">100</em>%</span>
            <input id="zoom" type="range" min="60" max="220" value="100">
          </label>
          <p class="note">SVG sẽ tô theo màu chữ/SVG. Ảnh kéo trực tiếp trên khung.</p>
        </div>
      </details>

    </section>

    <section class="export">
      <button class="go" id="share1024" type="button">Chia sẻ PNG 1024</button>
      <button class="go alt" id="share180" type="button">Chia sẻ PNG 180</button>
      <button class="go alt" id="shareSvg" type="button">Chia sẻ SVG</button>
      <button class="go ghost" id="dl1024" type="button">Tải PNG 1024</button>
    </section>
  </main>

  <input id="file" type="file" accept="image/*,.svg,image/svg+xml" hidden>

  <script src="js/app.js" defer></script>
</body>
</html>
