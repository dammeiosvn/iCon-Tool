<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo icon</title>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; background: #101214; color: #fff; }
  main { max-width: 460px; margin: 0 auto; padding: 16px 16px 48px; }
  canvas { width: 100%; border-radius: 28px; display: block; background:
    linear-gradient(45deg,#2a2a2a 25%,transparent 25%), linear-gradient(-45deg,#2a2a2a 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#2a2a2a 75%), linear-gradient(-45deg,transparent 75%,#2a2a2a 75%);
    background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0; touch-action: none; }
  label { display: block; margin: 12px 0 6px; font-size: 13px; color: #c9d0d4; }
  input, select, button.file { width: 100%; box-sizing: border-box; border: 0; border-radius: 12px; padding: 12px; font-size: 16px; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  button.go { margin-top: 8px; width: 100%; border: 0; border-radius: 14px; background: #3dcc6e; color: #fff; font-weight: 700; padding: 14px; font-size: 16px; }
  button.file { background: #2a3036; color: #fff; }
  p { font-size: 13px; color: #9aa3a9; }
</style>
</head>
<body>
<main>
  <canvas id="c" width="1024" height="1024"></canvas>
  <label>Nền</label>
  <select id="bg">
    <option value="grad2">Gradient 2 màu</option>
    <option value="grad3">Gradient 3 màu</option>
    <option value="solid">Màu đơn</option>
    <option value="clear">Trong suốt, chỉ khối kính</option>
  </select>
  <div class="row">
    <input id="a" type="color" value="#1c8f86" title="Màu 1">
    <input id="b" type="color" value="#3dcc6e" title="Màu 2">
    <input id="d" type="color" value="#e8fff4" title="Màu 3">
  </div>
  <label>Noise <input id="noise" type="range" min="0" max="40" value="6"></label>
  <label>Bo góc ngoài (0 = iOS tự cắt) <input id="radius" type="range" min="0" max="240" value="0"></label>
  <label>Độ mờ kính <input id="glass" type="range" min="0" max="80" value="28"></label>
  <label>Viền sáng <input id="stroke" type="range" min="0" max="24" value="8"></label>
  <label>Đổ bóng <input id="shadow" type="range" min="0" max="60" value="18"></label>
  <label>Ký hiệu</label>
  <select id="mark">
    <option value="sun">Mặt trời</option>
    <option value="plus">Dấu cộng</option>
    <option value="gear">Bánh răng</option>
    <option value="mail">Thư</option>
    <option value="phone">Điện thoại</option>
    <option value="text">Chữ 1–2 ký tự</option>
    <option value="svg">SVG của bạn</option>
    <option value="photo">Ảnh trong khung</option>
  </select>
  <input id="letters" maxlength="2" placeholder="1–2 ký tự" value="S">
  <div class="row">
    <select id="font">
      <option>SF Pro</option>
      <option>Georgia</option>
      <option>Courier New</option>
      <option>Arial Black</option>
    </select>
    <input id="size" type="number" min="40" max="420" value="220" title="Cỡ chữ">
  </div>
  <button class="file" id="pick" type="button">Chọn ảnh hoặc SVG</button>
  <input id="file" type="file" accept="image/*,.svg" hidden>
  <p>Chọn ảnh xong kéo trên khung để chỉnh.</p>
  <button class="go" id="png" type="button">Tải PNG 1024</button>
  <button class="go" id="png180" type="button">Tải PNG 180</button>
  <button class="go" id="svg" type="button">Tải SVG</button>
</main>
<script>
const c = document.getElementById("c"), x = c.getContext("2d");
const $ = id => document.getElementById(id);
let photo = null, svgImg = null, px = 50, py = 50, drag = null;

function round(ctx, x0, y0, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x0 + r, y0);
  ctx.arcTo(x0 + w, y0, x0 + w, y0 + h, r);
  ctx.arcTo(x0 + w, y0 + h, x0, y0 + h, r);
  ctx.arcTo(x0, y0 + h, x0, y0, r);
  ctx.arcTo(x0, y0, x0 + w, y0, r);
  ctx.closePath();
}
function draw() {
  x.clearRect(0, 0, 1024, 1024);
  x.save();
  const rad = +$("radius").value;
  if (rad) { round(x, 0, 0, 1024, 1024, rad); x.clip(); }
  if ($("bg").value !== "clear") {
    const g = x.createLinearGradient(0, 0, 1024, 1024);
    g.addColorStop(0, $("a").value);
    if ($("bg").value === "grad3") g.addColorStop(.5, $("d").value);
    g.addColorStop(1, $("bg").value === "solid" ? $("a").value : $("b").value);
    x.fillStyle = g; x.fillRect(0, 0, 1024, 1024);
    const n = +$("noise").value;
    for (let i = 0; i < n * 80; i++) {
      x.fillStyle = "rgba(255,255,255," + (Math.random() * .08) + ")";
      x.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
    }
  }
  round(x, 170, 250, 684, 560, 120);
  x.shadowColor = "rgba(0,0,0,.35)";
  x.shadowBlur = +$("shadow").value * 2;
  x.shadowOffsetY = +$("shadow").value;
  x.fillStyle = "rgba(255,255,255," + (+$("glass").value / 100) + ")";
  x.fill();
  x.shadowColor = "transparent";
  x.save(); x.clip();
  if ($("mark").value === "photo" && photo) {
    const ir = photo.width / photo.height, br = 684 / 560;
    let dw = 684, dh = 560, ox = 170, oy = 250;
    if (ir > br) { dw = 560 * ir; ox = 170 - (dw - 684) * (px / 100); }
    else { dh = 684 / ir; oy = 250 - (dh - 560) * (py / 100); }
    x.drawImage(photo, ox, oy, dw, dh);
  }
  x.restore();
  if (+$("stroke").value) {
    round(x, 170, 250, 684, 560, 120);
    x.strokeStyle = "rgba(255,255,255,.75)";
    x.lineWidth = +$("stroke").value;
    x.stroke();
  }
  x.fillStyle = "#fff"; x.strokeStyle = "#fff"; x.lineWidth = 28; x.lineCap = "round";
  const m = $("mark").value;
  if (m === "sun") { x.beginPath(); x.arc(512, 470, 54, 0, 7); x.fill(); x.fillRect(360, 575, 304, 10); }
  else if (m === "plus") { x.fillRect(482, 400, 60, 220); x.fillRect(402, 480, 220, 60); }
  else if (m === "gear") {
    x.beginPath(); x.arc(512, 520, 70, 0, 7); x.stroke();
    for (let i = 0; i < 8; i++) {
      const t = i / 8 * Math.PI * 2;
      x.beginPath();
      x.moveTo(512 + Math.cos(t) * 100, 520 + Math.sin(t) * 100);
      x.lineTo(512 + Math.cos(t) * 138, 520 + Math.sin(t) * 138);
      x.stroke();
    }
  } else if (m === "mail") {
    x.strokeRect(392, 430, 240, 170);
    x.beginPath(); x.moveTo(392, 430); x.lineTo(512, 530); x.lineTo(632, 430); x.stroke();
  } else if (m === "phone") {
    round(x, 456, 430, 112, 180, 24); x.stroke();
    x.beginPath(); x.arc(512, 575, 10, 0, 7); x.fill();
  } else if (m === "text") {
    x.font = "700 " + $("size").value + "px " + $("font").value;
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText(($("letters").value || "S").slice(0, 2), 512, 530);
  } else if (m === "svg" && svgImg) x.drawImage(svgImg, 400, 420, 224, 224);
  x.restore();
}
function svgMarkup() {
  const clear = $("bg").value === "clear";
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">' +
    (clear ? "" : '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="' + $("a").value + '"/><stop offset="1" stop-color="' + ($("bg").value === "solid" ? $("a").value : $("b").value) + '"/></linearGradient></defs><rect width="1024" height="1024" rx="' + $("radius").value + '" fill="url(#g)"/>') +
    '<rect x="170" y="250" width="684" height="560" rx="120" fill="rgba(255,255,255,' + (+$("glass").value / 100) + ')" stroke="rgba(255,255,255,.75)" stroke-width="' + $("stroke").value + '"/>' +
    ($("mark").value === "text" ? '<text x="512" y="545" text-anchor="middle" font-size="' + $("size").value + '" font-family="' + $("font").value + '" fill="#fff">' + ($("letters").value || "S").slice(0, 2) + "</text>" : "") +
    "</svg>";
}
function save(name, url) { const a = document.createElement("a"); a.href = url; a.download = name; a.click(); }
$("png").onclick = () => save("icon-home-screen.png", c.toDataURL("image/png"));
$("png180").onclick = () => {
  const s = document.createElement("canvas"); s.width = s.height = 180;
  s.getContext("2d").drawImage(c, 0, 0, 180, 180);
  save("icon-180.png", s.toDataURL("image/png"));
};
$("svg").onclick = () => save("icon-home-screen.svg", URL.createObjectURL(new Blob([svgMarkup()], {type: "image/svg+xml"})));
$("pick").onclick = () => $("file").click();
$("file").onchange = () => {
  const f = $("file").files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      if ((f.type || "").includes("svg") || /\.svg$/i.test(f.name)) { svgImg = img; $("mark").value = "svg"; }
      else { photo = img; $("mark").value = "photo"; }
      draw();
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
};
c.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY, px, py }; c.setPointerCapture(e.pointerId); };
c.onpointermove = e => {
  if (!drag || $("mark").value !== "photo") return;
  px = Math.max(0, Math.min(100, drag.px - (e.clientX - drag.x) / 4));
  py = Math.max(0, Math.min(100, drag.py - (e.clientY - drag.y) / 4));
  draw();
};
c.onpointerup = () => { drag = null; };
document.querySelectorAll("input,select").forEach(el => el.oninput = draw);
draw();
</script>
</body>
</html>
