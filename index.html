<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tạo Biểu Tượng IOS">
  <meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Tạo biểu tượng phím tắt và webclip cho iOS">
  <title>Tạo Biểu Tượng IOS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-home-screen.png" sizes="180x180">
  <link rel="icon" type="image/png" href="icon-home-screen.png">
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>
  <script>document.addEventListener('gesturestart', function (e) { e.preventDefault(); });</script>
  <header class="top">
    <h1>Tạo Biểu Tượng IOS</h1>
    <div class="tools">
      <button type="button" id="undo" title="Hoàn tác">↩</button>
      <button type="button" id="redo" title="Làm lại">↪</button>
      <button type="button" id="reset" title="Đặt lại">↺</button>
    </div>
  </header>

  <div class="workspace">
  <section class="stage" id="stage">
    <div class="mock" id="mock">
      <div class="stage-frame" id="frame">
        <canvas id="c" width="1024" height="1024"></canvas>
        <div class="safe" id="safe" hidden></div>
      </div>
      <div class="mock-name" id="mockName">Icon</div>
    </div>
    <p class="warn" id="warn" hidden></p>
  </section>

  <nav class="rail" id="rail" aria-label="Công cụ">
    <button type="button" data-panel="bg">Nền</button>
    <button type="button" data-panel="radius">Bo góc</button>
    <button type="button" data-panel="glass">Kính</button>
    <button type="button" data-panel="shadow">Bóng</button>
    <button type="button" data-panel="mark">Chữ</button>
    <button type="button" data-panel="media">Ảnh</button>
    <button type="button" data-panel="home">MH</button>
    <button type="button" data-panel="export">Xuất</button>
  </nav>
  </div>

  <aside class="sheet" id="sheet" hidden>
    <div class="sheet-head">
      <strong id="sheetTitle">Nền</strong>
      <button type="button" id="sheetClose">Đóng</button>
    </div>
    <div class="sheet-body">

      <div class="pane" data-pane="bg">
        <label class="field"><span>Kiểu nền</span>
          <select id="bg">
            <option value="grad2">Gradient 2 màu</option>
            <option value="grad3">Gradient 3 màu</option>
            <option value="solid">Màu đơn</option>
            <option value="clear">Trong suốt</option>
          </select>
        </label>
        <div class="swatches">
          <label class="swatch"><input id="c1" type="color" value="#1c8f86"><span>Màu 1</span></label>
          <label class="swatch"><input id="c2" type="color" value="#3dcc6e"><span>Màu 2</span></label>
          <label class="swatch"><input id="c3" type="color" value="#e8fff4"><span>Màu 3</span></label>
        </div>
        <label class="slide"><span>Góc gradient</span><em id="angVal">45°</em>
          <input id="ang" type="range" min="0" max="360" value="45">
        </label>
        <label class="slide"><span>Noise</span><em id="noiseVal">6</em>
          <input id="noise" type="range" min="0" max="40" value="6">
        </label>
        <div class="row">
          <button class="file grow" id="pickDrop" type="button">Lấy màu</button>
          <label class="field grow"><span>Gắn vào</span>
            <select id="dropTo">
              <option value="c1">Nền 1</option>
              <option value="c2">Nền 2</option>
              <option value="ink">Chữ A</option>
              <option value="ink2">Chữ B</option>
            </select>
          </label>
        </div>
      </div>

      <div class="pane" data-pane="radius">
        <label class="slide"><span>Bo góc</span><em id="radiusVal">0</em>
          <input id="radius" type="range" min="0" max="512" value="0">
        </label>
        <label class="check"><input id="squircle" type="checkbox"><span>Squircle iOS</span></label>
        <label class="check"><input id="safeOn" type="checkbox"><span>Safe zone</span></label>
      </div>

      <div class="pane" data-pane="glass">
        <label class="slide"><span>Kính trong</span><em id="glassVal">0</em>
          <input id="glass" type="range" min="0" max="80" value="0">
        </label>
        <label class="slide"><span>Viền sáng</span><em id="strokeVal">0</em>
          <input id="stroke" type="range" min="0" max="32" value="0">
        </label>
        <label class="slide"><span>Lề nội dung</span><em id="padVal">48</em>
          <input id="pad" type="range" min="0" max="280" value="48">
        </label>
      </div>

      <div class="pane" data-pane="shadow">
        <div class="chips" id="styles">
          <button type="button" data-style="flat">Phẳng</button>
          <button type="button" data-style="glass">Kính</button>
          <button type="button" data-style="neu">Neu</button>
          <button type="button" data-style="glow">Glow</button>
          <button type="button" data-style="clay">Sét</button>
          <button type="button" data-style="soft">Mềm</button>
        </div>
        <label class="field"><span>Thêm lớp</span>
          <select id="addLayer">
            <option value="">+ Thêm lớp…</option>
            <option value="outer">Bóng Ngoài</option>
            <option value="inset">Bóng Chìm</option>
            <option value="soft">Mờ Diện Rộng</option>
            <option value="hard">Nổi Khối 3D</option>
            <option value="glow">Phát Sáng</option>
            <option value="bottom">Bóng Dưới (Apple)</option>
            <option value="floating">Nổi Bay</option>
            <option value="pressed">Ấn Xuống</option>
            <option value="pop">Pop Bubble</option>
            <option value="double">Viền Kép</option>
            <option value="neu">Neumorphism Nổi</option>
            <option value="neuIn">Neumorphism Chìm</option>
            <option value="neon">Neon</option>
            <option value="long">Bóng Dài Retro</option>
            <option value="crisp">Sắc Nét Nhẹ</option>
            <option value="clay">Đất Sét 3D</option>
          </select>
        </label>
        <div class="layers" id="layerList"></div>
        <label class="field"><span>Lớp này áp lên</span>
          <select id="layerTarget">
            <option value="frame">Khung icon</option>
            <option value="content">Ảnh / SVG / chữ</option>
          </select>
        </label>
        <label class="slide"><span>X</span><em id="sxVal">0</em><input id="sx" type="range" min="-60" max="60" value="0"></label>
        <label class="slide"><span>Y</span><em id="syVal">18</em><input id="sy" type="range" min="-60" max="60" value="18"></label>
        <label class="slide"><span>Làm mờ</span><em id="sblurVal">24</em><input id="sblur" type="range" min="0" max="80" value="24"></label>
        <label class="slide"><span>Độ đậm</span><em id="salphaVal">40</em><input id="salpha" type="range" min="0" max="90" value="40"></label>
        <label class="swatch lone"><input id="scolor" type="color" value="#000000"><span>Màu bóng</span></label>
        <label class="check"><input id="bakeShadow" type="checkbox"><span>Thu nhỏ icon để chừa bóng khi xuất</span></label>
      </div>

      <div class="pane" data-pane="mark">
        <label class="field"><span>Tìm symbol</span>
          <input id="symQ" type="search" placeholder="wifi, pin, tim…" autocomplete="off">
        </label>
        <div class="symgrid" id="symGrid"></div>
        <label class="field"><span>Chữ</span>
          <input id="letters" maxlength="24" placeholder="Tên icon" value="S" autocomplete="off">
        </label>
        <label class="field"><span>Font hệ thống</span>
          <select id="font">
            <option value="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" style="font-family:-apple-system,system-ui,sans-serif">SF Pro</option>
            <option value="ui-rounded, -apple-system, sans-serif" style="font-family:ui-rounded,sans-serif">SF Pro Rounded</option>
            <option value="ui-serif, 'New York', Georgia, serif" style="font-family:ui-serif,Georgia,serif">New York</option>
            <option value="ui-monospace, 'SF Mono', Menlo, monospace" style="font-family:ui-monospace,Menlo,monospace">SF Mono</option>
            <option value="'Helvetica Neue', Helvetica, Arial, sans-serif" style="font-family:'Helvetica Neue',Helvetica,sans-serif">Helvetica Neue</option>
            <option value="Avenir Next, Avenir, sans-serif" style="font-family:Avenir Next,Avenir,sans-serif">Avenir Next</option>
            <option value="Avenir, sans-serif" style="font-family:Avenir,sans-serif">Avenir</option>
            <option value="Futura, sans-serif" style="font-family:Futura,sans-serif">Futura</option>
            <option value="'Gill Sans', sans-serif" style="font-family:'Gill Sans',sans-serif">Gill Sans</option>
            <option value="Optima, sans-serif" style="font-family:Optima,sans-serif">Optima</option>
            <option value="Baskerville, serif" style="font-family:Baskerville,serif">Baskerville</option>
            <option value="Didot, serif" style="font-family:Didot,serif">Didot</option>
            <option value="Palatino, 'Palatino Linotype', serif" style="font-family:Palatino,serif">Palatino</option>
            <option value="Georgia, serif" style="font-family:Georgia,serif">Georgia</option>
            <option value="'Times New Roman', Times, serif" style="font-family:'Times New Roman',serif">Times New Roman</option>
            <option value="'American Typewriter', serif" style="font-family:'American Typewriter',serif">American Typewriter</option>
            <option value="Copperplate, serif" style="font-family:Copperplate,serif">Copperplate</option>
            <option value="'Courier New', Courier, monospace" style="font-family:'Courier New',monospace">Courier New</option>
            <option value="Menlo, monospace" style="font-family:Menlo,monospace">Menlo</option>
            <option value="'Arial Black', sans-serif" style="font-family:'Arial Black',sans-serif">Arial Black</option>
            <option value="Impact, sans-serif" style="font-family:Impact,sans-serif">Impact</option>
            <option value="'Marker Felt', sans-serif" style="font-family:'Marker Felt',sans-serif">Marker Felt</option>
            <option value="'Chalkboard SE', sans-serif" style="font-family:'Chalkboard SE',sans-serif">Chalkboard SE</option>
            <option value="'Snell Roundhand', cursive" style="font-family:'Snell Roundhand',cursive">Snell Roundhand</option>
            <option value="'Bradley Hand', cursive" style="font-family:'Bradley Hand',cursive">Bradley Hand</option>
          </select>
        </label>
        <label class="field"><span>Màu chữ / SVG</span>
          <select id="inkMode">
            <option value="solid">Một màu</option>
            <option value="grad">Gradient</option>
          </select>
        </label>
        <div class="swatches">
          <label class="swatch"><input id="ink" type="color" value="#5ac8fa"><span>Màu A</span></label>
          <label class="swatch"><input id="ink2" type="color" value="#007aff"><span>Màu B</span></label>
        </div>
        <label class="slide"><span>Góc màu</span><em id="inkAngVal">90°</em>
          <input id="inkAng" type="range" min="0" max="360" value="90">
        </label>
        <label class="slide"><span>Cỡ</span><em id="sizeVal">220</em>
          <input id="size" type="range" min="12" max="900" value="220">
        </label>
        <label class="slide"><span>Mờ</span><em id="alphaVal">100%</em>
          <input id="alpha" type="range" min="10" max="100" value="100">
        </label>
        <label class="field"><span>Dòng 2</span>
          <input id="letters2" maxlength="24" placeholder="Phụ đề" value="" autocomplete="off">
        </label>
        <label class="slide"><span>Cỡ dòng 2</span><em id="size2Val">96</em>
          <input id="size2" type="range" min="0" max="400" value="96">
        </label>
        <label class="slide"><span>Giãn dòng</span><em id="gap2Val">8</em>
          <input id="gap2" type="range" min="-40" max="80" value="8">
        </label>
        <label class="check"><input id="snap" type="checkbox" checked><span>Snap tâm khi kéo</span></label>
        <button class="file" id="autoInk" type="button">Màu theo nền</button>
        <select id="mark" hidden>
          <option value="none">Không</option>
          <option value="text" selected>Chữ</option>
          <option value="sun">sun</option>
          <option value="plus">plus</option>
          <option value="gear">gear</option>
          <option value="mail">mail</option>
          <option value="phone">phone</option>
          <option value="star">star</option>
          <option value="heart">heart</option>
          <option value="svg">svg</option>
          <option value="photo">photo</option>
        </select>
      </div>

      <div class="pane" data-pane="media">
        <button class="file" id="pick" type="button">Thêm ảnh / SVG</button>
        <button class="file" id="cam" type="button">Chụp ảnh</button>
        <button class="file" id="addText" type="button">Thêm chữ</button>
        <div class="layers" id="stack"></div>
        <button class="file" id="center" type="button">Căn giữa</button>
        <label class="slide"><span>Phóng</span><em id="zoomVal">100%</em>
          <input id="zoom" type="range" min="20" max="400" value="100">
        </label>
        <label class="slide"><span>Ngang</span><em id="pxVal">50</em>
          <input id="px" type="range" min="-20" max="120" value="50">
        </label>
        <label class="slide"><span>Dọc</span><em id="pyVal">50</em>
          <input id="py" type="range" min="-20" max="120" value="50">
        </label>
        <label class="slide"><span>Xoay</span><em id="rotVal">0°</em>
          <input id="rot" type="range" min="-180" max="180" value="0">
        </label>
        <label class="slide"><span>Viền chủ thể</span><em id="edgeVal">0</em>
          <input id="edge" type="range" min="0" max="48" value="0">
        </label>
        <label class="slide" id="edgeAngWrap" hidden><span>Góc gradient</span><em id="edgeAngVal">45°</em>
          <input id="edgeAng" type="range" min="0" max="360" value="45">
        </label>
        <label class="field"><span>Màu viền</span>
          <select id="edgeMode">
            <option value="1">1 màu</option>
            <option value="2">2 màu</option>
            <option value="3">3 màu</option>
          </select>
        </label>
        <div class="swatches">
          <label class="swatch"><input id="edge1" type="color" value="#ffffff"><span>Màu 1</span></label>
          <label class="swatch" id="edge2wrap" hidden><input id="edge2" type="color" value="#5ac8fa"><span>Màu 2</span></label>
          <label class="swatch" id="edge3wrap" hidden><input id="edge3" type="color" value="#ff9f0a"><span>Màu 3</span></label>
        </div>
        <div class="ticks">
          <label class="check"><span>Lật ngang</span><input id="flipH" type="checkbox"></label>
          <label class="check"><span>Lật dọc</span><input id="flipV" type="checkbox"></label>
          <label class="check"><span>Giữ màu gốc SVG</span><input id="keepSvg" type="checkbox"></label>
        </div>
      </div>

      <div class="pane" data-pane="home">
        <div class="ab">
          <button type="button" id="abA" class="ab-card"><canvas id="abAc" width="160" height="160"></canvas><em>A</em></button>
          <button type="button" id="abB" class="ab-card"><canvas id="abBc" width="160" height="160"></canvas><em>B</em></button>
        </div>
        <div class="row">
          <button class="file grow" id="snapA" type="button">Chốt A</button>
          <button class="file grow" id="snapB" type="button">Chốt B</button>
        </div>
        <label class="check"><input id="mockOn" type="checkbox" checked><span>Khung xem trước</span></label>
        <label class="field"><span>Tên MH</span>
          <input id="label" maxlength="14" value="Icon" autocomplete="off">
        </label>
        <label class="field"><span>Nền khung</span>
          <select id="wall">
            <option value="system" selected>Hệ thống</option>
            <option value="ios">Wallpaper iOS</option>
            <option value="dark">Tối</option>
            <option value="light">Sáng</option>
            <option value="sunset">Hoàng hôn</option>
          </select>
        </label>
        <div class="row">
          <button class="file grow" id="saveLib" type="button">Lưu vào kho</button>
          <button class="file grow" id="saveStyle" type="button">Lưu style</button>
        </div>
        <button class="file" id="applyStyle" type="button">Áp style đã lưu</button>
        <div class="lib" id="lib"></div>
        <label class="field"><span>Bộ icon</span>
          <select id="kitN">
            <option value="6">6 ô</option>
            <option value="8" selected>8 ô</option>
            <option value="12">12 ô</option>
          </select>
        </label>
        <div class="kit" id="kit"></div>
        <button class="go" id="exportKit" type="button">Xuất bộ ZIP</button>
      </div>

      <div class="pane" data-pane="export">
        <label class="field"><span>Tên file / tên MH</span>
          <input id="fileBase" maxlength="32" value="icon-home-screen" autocomplete="off">
        </label>
        <div class="runbox">
          <label class="field"><span>Tên phím tắt</span>
            <input id="runName" maxlength="40" placeholder="Tên phím tắt" autocomplete="off">
          </label>
          <label class="field"><span>Đã lưu</span>
            <select id="runSaved"><option value="">Chọn tên đã lưu</option></select>
          </label>
          <label class="field"><span>Cỡ icon</span>
            <input id="runSize" type="number" min="16" max="180" value="60" inputmode="numeric">
          </label>
          <button class="go" id="runShortcut" type="button">Chạy phím tắt</button>
          <button class="go alt" id="saveRun" type="button">Lưu tên</button>
        </div>
        <label class="check"><input id="opaque" type="checkbox" checked><span>PNG nền đặc</span></label>
        <button class="go" id="share1024" type="button">Chia sẻ PNG 1024</button>
        <button class="go alt" id="share180" type="button">Chia sẻ PNG 180</button>
        <button class="go alt" id="shareZip" type="button">Gói webclip ZIP</button>
        <button class="go alt" id="shareSvg" type="button">Chia sẻ SVG</button>
        <button class="go alt" id="shareConfig" type="button">Xuất .mobileconfig</button>
        <div id="configBox" hidden>
          <label class="field"><span>Tên webclip</span>
            <input id="clipName" maxlength="24" placeholder="Tên trên màn hình" autocomplete="off">
          </label>
          <label class="field"><span>URL webclip</span>
            <input id="clipUrl" maxlength="500" placeholder="https:// hoặc shortcuts:// hoặc zalo://" autocomplete="off">
          </label>
          <label class="field"><span>Mô tả</span>
            <input id="clipDesc" maxlength="80" placeholder="Mô tả webclip" autocomplete="off">
          </label>
          <button class="go" id="saveConfig" type="button">Xuất hồ sơ</button>
        </div>
        <div class="tip" id="tip" hidden>
          <p id="tipText"></p>
          <img id="tipQr" alt="" hidden>
        </div>
      </div>

    </div>
  </aside>

  <input id="file" type="file" accept="image/*,.svg,image/svg+xml" hidden>
  <input id="fileCam" type="file" accept="image/*" capture="environment" hidden>
  <input id="fileKit" type="file" accept="image/*" hidden>

  <script src="js/app.js" defer></script>
</body>
</html>
